[project]
name = "micras-chassis"
version = "0.1.0"
description = "Parametric chassis for the Micras micromouse (build123d)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "build123d>=0.13",
    "ocp_vscode>=2.8",
    "numpy",
    "zstandard>=0.25.0",
]

[dependency-groups]
dev = ["pytest", "pyvista", "magpylib", "matplotlib"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
