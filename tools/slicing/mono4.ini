# Anycubic Photon Mono 4 for PrusaSlicer's SLA mode: the printer, the motion and the supports (tools/slice.py
# loads it with one of the resin files, which hold the exposure; both also load in the PrusaSlicer GUI with
# File > Import > Import Config). The display is from UVtools' profile (9024 x 5120 px of 17 um). UVtools turns
# the .sl1 into .pm4n and takes the motion from the custom values in printer_notes (speeds in mm/min).
#
# Settings for small, precise parts (sources in docs/printing.md):
# - slow lifts (1 mm/s up, 2 mm/s down): the soft fresh layers and the support tips bend less
# - 2 s rest after each retract: the resin film settles before the exposure (even layers)
# - anti-aliasing off (gamma_correction = 0): AA's grey edge pixels mostly don't cure and shift the edges; at
#   17 um pixels it gains nothing for these parts. Keep it as it is once calibrated: it changes the fits.
# - strong supports: 0.5 mm tips biting 0.3 mm into the part (0.4 mm tips tore off the first calibration print's
#   small rows), dense, 1 mm pillars, 3 mm high on a pad
# The .pm4n format keeps one set of lift values for all layers.
printer_technology = SLA
bed_shape = 0x0,153.408x0,153.408x87.04,0x87.04
display_width = 153.408
display_height = 87.04
display_pixels_x = 9024
display_pixels_y = 5120
display_orientation = landscape
display_mirror_x = 1
display_mirror_y = 0
max_print_height = 165
gamma_correction = 0
min_exposure_time = 1
max_exposure_time = 120
min_initial_exposure_time = 1
max_initial_exposure_time = 300
sla_archive_format = SL1
sla_output_precision = 0.001
printer_notes = PRINTER_VENDOR_ANYCUBIC\nPRINTER_MODEL_PHOTON_MONO_4\nFILEFORMAT_PM4N\n\nSTART_CUSTOM_VALUES\nWaitTimeBeforeCure_2\nLiftHeight_6\nLiftSpeed_60\nRetractSpeed_120\nLightPWM_255\nTransitionLayerCount_4\nEND_CUSTOM_VALUES

# no corrections: the parts carry their own fits (set them from the fit-test coupon, docs/printing.md)
relative_correction_x = 1
relative_correction_y = 1
relative_correction_z = 1
elefant_foot_compensation = 0

# supports: lifted 3 mm off a pad (the bottom layers' over-cure stays in the pad), braced pillar to pillar (cross),
# so they come off as one piece; the pad is 1.2 mm thick (1.5 printed fine: thinner wastes less resin; the bottom
# layers are 0.3 of it) with 45 deg borders: the spatula slides under its thin edge
supports_enable = 1
support_tree_type = default
support_head_front_diameter = 0.5
material_ow_support_head_front_diameter = 0.5
support_head_penetration = 0.3
support_head_width = 1.2
support_pillar_diameter = 1.0
material_ow_support_pillar_diameter = 1.0
support_small_pillar_diameter_percent = 60%
support_points_density_relative = 160
material_ow_support_points_density_relative = 160
support_object_elevation = 3
support_critical_angle = 45
pad_enable = 1
pad_wall_height = 0
pad_brim_size = 3
pad_max_merge_distance = 4
pad_wall_thickness = 1.2
hollowing_enable = 0
pad_wall_slope = 45
support_pillar_connection_mode = cross
support_max_bridges_on_pillar = 3
