# PLA on the Ender 3 V3 SE (the battery basket: thin walls, its floor on supports, printed upside down)
filament_type = PLA
filament_density = 1.24
temperature = 210
first_layer_temperature = 215
bed_temperature = 60
first_layer_bed_temperature = 60
filament_max_volumetric_speed = 12
fan_always_on = 1
cooling = 1
min_fan_speed = 100
max_fan_speed = 100
bridge_fan_speed = 100
disable_fan_first_layers = 1
retract_length = 0.8
retract_speed = 40
deretract_speed = 30
perimeter_speed = 60
external_perimeter_speed = 40
small_perimeter_speed = 25
infill_speed = 100
solid_infill_speed = 80
top_solid_infill_speed = 50
gap_fill_speed = 40
bridge_speed = 25
over_bridge_speed = 40
brim_width = 3
# the floor's skin bridges across the basket's 21 mm width, between its end walls: slice.py lays the basket
# lengthwise along X, so the bridges run along Y (PrusaSlicer would pick the long side)
bridge_angle = 90
# the bridges alone sagged in the first print: supports from the bed under the floor (inside the box, where
# they come out through its open side; they don't land on the part)
support_material = 1
support_material_auto = 1
support_material_buildplate_only = 1
support_material_threshold = 40
support_material_contact_distance = 0.2
support_material_interface_layers = 2
support_material_spacing = 2
support_material_style = grid
# 1 mm from the walls: at the default 50 % the grid ran 0.3 mm inside the walls and welded to them
support_material_xy_spacing = 1
