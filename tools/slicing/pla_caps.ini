# The wall-sensor caps in black PLA on the Ender 3 V3 SE (read after pla.ini): small parts, front face down with
# their bores vertical; nothing overhangs but the crush ribs' ends, so no supports. Light went through the resin
# caps: solid (100 % infill, no gaps between the lines for IR to leak through) and fine layers (0.08: tight, round
# bores), slow outer walls; each layer takes long enough to cool (the parts are small).
layer_height = 0.08
fill_density = 100%
fill_pattern = rectilinear
infill_overlap = 30%
first_layer_height = 0.2
support_material = 0
support_material_auto = 0
perimeters = 2
external_perimeter_speed = 20
perimeter_speed = 25
small_perimeter_speed = 15
gap_fill_speed = 20
slowdown_below_layer_time = 10
min_print_speed = 8
# one cap at a time, each from the bed to its top before the next (a failed one doesn't take the others with it;
# each layer cools while the head is away less, so the layer-time slowdown below matters). The head (hotend, fan
# duct) fits in a 45 mm radius round the nozzle; the caps (9.6 mm) are far below the X gantry. slice.py spaces the
# parts 46 mm apart for it
complete_objects = 1
extruder_clearance_radius = 45
extruder_clearance_height = 20
# the front face is on the bed: a brim holds the tall, narrow caps (trim it off flush with the hood's mouth)
brim_width = 3
# gentler part-cooling fan: pla.ini's 100 % from the second layer, on these small, slow, 0.08 mm parts close to the
# bed, cooled the nozzle until the printer's thermal-runaway protection stopped round 7's print mid-way (alarm).
# 50-70 %, ramped up over the first 4 layers; slowdown_below_layer_time still gives each layer 10 s to cool
min_fan_speed = 50
max_fan_speed = 70
bridge_fan_speed = 70
full_fan_speed_layer = 4
# one temperature throughout (no step down from the first layer's 215)
temperature = 215
