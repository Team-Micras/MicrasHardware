# Creality Ender 3 V3 SE for PrusaSlicer (read by tools/slice.py together with one of the filament files;
# also loads in the GUI with File > Import > Import Config). Machine values and start G-code from the
# Creality-supplied OrcaSlicer profile (with its M82 for the absolute-E purge lines); M420 S1 turns on the bed
# mesh the printer stored at its auto-levelling.
printer_technology = FFF
bed_shape = 0x0,220x0,220x220,0x220
max_print_height = 250
nozzle_diameter = 0.4
filament_diameter = 1.75
gcode_flavor = marlin2
use_relative_e_distances = 1
binary_gcode = 0
machine_limits_usage = time_estimate_only
machine_max_acceleration_extruding = 2500
machine_max_acceleration_travel = 2500
machine_max_feedrate_x = 250
machine_max_feedrate_y = 250
start_gcode = M220 S100 ; reset feed rate\nM221 S100 ; reset flow\nM140 S[first_layer_bed_temperature]\nM104 S150 ; warm the nozzle without oozing\nG28\nM420 S1 ; use the stored bed mesh\nM190 S[first_layer_bed_temperature]\nM109 S[first_layer_temperature]\nM82 ; absolute E for the purge lines (PrusaSlicer sends M83 after this)\nG92 E0\nG1 Z2.0 F3000\nG1 X-2.1 Y20 Z0.28 F5000.0\nG1 X-2.1 Y145.0 Z0.28 F700 E15 ; purge line (slow enough for TPU)\nG1 X-2.4 Y145.0 Z0.28 F5000.0\nG1 X-2.4 Y20 Z0.28 F700 E30 ; second line\nG92 E0\nG1 Z2.0 F3000
end_gcode = G91\nG1 E-2 F2700\nG1 Z10\nG90\nG1 X0 Y220 ; present the bed\nM106 S0\nM104 S0\nM140 S0\nM84 X Y E
layer_gcode = G92 E0
retract_before_travel = 1.5
retract_lift = 0.2
wipe = 1

layer_height = 0.16
first_layer_height = 0.2
perimeter_generator = arachne
perimeters = 3
top_solid_layers = 5
bottom_solid_layers = 4
fill_density = 40%
fill_pattern = gyroid
seam_position = aligned
external_perimeters_first = 0
thick_bridges = 0
bridge_flow_ratio = 0.9
first_layer_speed = 20
travel_speed = 150
support_material = 0
brim_type = outer_only
skirts = 1
skirt_distance = 4
xy_size_compensation = 0
elefant_foot_compensation = 0.15
gcode_comments = 0
gcode_label_objects = firmware
