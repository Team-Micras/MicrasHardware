# Anycubic Standard resin (the first calibration print; the parts now use resin_abs_pro2.ini). Exposure from
# Anycubic's chart for the Photon Mono 4 (0.05 mm, 2.8 s, bottom 30 s x 5): keep the resin at 25-30 °C (below
# 20 °C it needs about 30 % more). The fits are calibrated at this exposure with the fit-test coupon
# (docs/printing.md): change it and the coupon has to be printed again. The bottom layers only build the pad.
layer_height = 0.05
initial_layer_height = 0.05
exposure_time = 2.8
initial_exposure_time = 30
faded_layers = 5
absolute_correction = 0
material_ow_absolute_correction = 0
