# Anycubic ABS-Like Resin Pro 2 (grey): every resin part (the sensor caps are painted black afterwards).
# Exposure from the exposure test (tools/rerf.py, 2.0-3.75 s): Anycubic's table says 3.0 s, but at 3.0 s every hole in
# the first parts came out too tight. At 2.0 s the holes printed about nominal and the fits worked, but the parts
# were weak (layers parting, the impellers warped). So 2.5 s (Anycubic's resin manual says 2.4 s), with every hole in
# the code 0.05 bigger than the fits that worked at 2.0 s (holes close by about 0.1 per second of exposure). Keep the
# resin at 25-30 °C (below 20 °C it needs about 30 % more). Change the exposure and the fits change with it (the fit
# bars, fit_test.fit_blocks, check them). The bottom layers only build the pad: they're cured harder than
# Anycubic's 35 s x 5 (45 s x 6) for a sure grip on the plate; the parts start 4.5 mm up, on supports.
layer_height = 0.05
initial_layer_height = 0.05
exposure_time = 2.5
initial_exposure_time = 45
faded_layers = 6
absolute_correction = 0
material_ow_absolute_correction = 0
