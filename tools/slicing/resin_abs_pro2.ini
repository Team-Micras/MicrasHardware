# Anycubic ABS-Like Resin Pro 2 (grey): every resin part (the sensor caps are painted black afterwards).
# Exposure from Anycubic's settings table for the Photon Mono 4 (0.05 mm, 3.0 s, bottom 35 s x 5; its blog says
# 2.8 s, its resin manual 2.4 s): confirm it with the exposure test (docs/printing.md). Keep the resin at
# 25-30 °C (below 20 °C it needs about 30 % more). The fits are calibrated at this exposure with the fit-test
# coupon: change it and the coupon has to be printed again. The bottom layers only build the pad.
layer_height = 0.05
initial_layer_height = 0.05
exposure_time = 3.0
initial_exposure_time = 35
faded_layers = 5
absolute_correction = 0
material_ow_absolute_correction = 0
